name: Auto Bump Version & Release Signed APK

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Optional explicit integer versionCode"
        required: false
      version_name:
        description: "Optional explicit versionName (e.g. 1.2.1)"
        required: false

permissions:
  contents: write

jobs:
  build-and-release-apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Persist fallback CI debug keystore when custom release secret is unset
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ag-file-manager-ci-signing-key-v1

      - name: Auto-bump version on main push (or apply tag/manual version)
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_name }}" ]; then
            ARGS="--clean-apks --name ${{ github.event.inputs.version_name }}"
            if [ -n "${{ github.event.inputs.version_code }}" ]; then
              ARGS="$ARGS --code ${{ github.event.inputs.version_code }}"
            fi
            node scripts/bump-version.mjs $ARGS
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            node scripts/bump-version.mjs --clean-apks --name "$TAG_VER" --code "${{ github.run_number }}"
          else
            node scripts/bump-version.mjs --clean-apks
          fi

          V_CODE=$(node -e "console.log(require('./version.json').versionCode)")
          V_NAME=$(node -e "console.log(require('./version.json').versionName)")
          APK_NAME="AG_File_Manager_v${V_NAME}.apk"
          echo "version_code=${V_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${V_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build web frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Decode persistent release keystore if configured
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android-project/app/release-keystore.jks
            echo "KEYSTORE_FILE=release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build and verify signed Android APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/build-android-apk.sh

      - name: Commit bumped version and updated APK to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${{ steps.bump.outputs.version_name }} (build ${{ steps.bump.outputs.version_code }}) [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release and upload signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version_name }}"
          name: "AG File Manager v${{ steps.bump.outputs.version_name }}"
          generate_release_notes: true
          files: |
            ${{ steps.bump.outputs.apk_name }}
            version.json

      - name: Upload APK as Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bump.outputs.apk_name }}
          path: ${{ steps.bump.outputs.apk_name }}
