name: Auto Bump Version & Release Signed APK

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Optional explicit integer versionCode"
        required: false
      version_name:
        description: "Optional explicit versionName (e.g. 1.2.1)"
        required: false

permissions:
  contents: write

jobs:
  build-and-release-apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Persist fallback CI debug keystore when custom release secret is unset
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ag-file-manager-ci-signing-key-v2-${{ github.run_id }}
          restore-keys: |
            ag-file-manager-ci-signing-key-v2-
            ag-file-manager-ci-signing-key-v1

      - name: Auto-bump version on main push (or apply tag/manual version)
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_name }}" ]; then
            ARGS="--clean-apks --name ${{ github.event.inputs.version_name }}"
            if [ -n "${{ github.event.inputs.version_code }}" ]; then
              ARGS="$ARGS --code ${{ github.event.inputs.version_code }}"
            fi
            node scripts/bump-version.mjs $ARGS
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            node scripts/bump-version.mjs --clean-apks --name "$TAG_VER"
          else
            node scripts/bump-version.mjs --clean-apks
          fi

          V_CODE=$(node -e "console.log(require('./version.json').versionCode)")
          V_NAME=$(node -e "console.log(require('./version.json').versionName)")
          APK_NAME="AG_File_Manager_v${V_NAME}.apk"
          echo "version_code=${V_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${V_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build web frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Decode persistent release keystore if configured
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android-project/app/release-keystore.jks
            echo "KEYSTORE_FILE=release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build and verify signed Android APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/build-android-apk.sh

      - name: Commit bumped version and updated APK to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${{ steps.bump.outputs.version_name }} (build ${{ steps.bump.outputs.version_code }}) [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release and upload signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: "v${{ steps.bump.outputs.version_name }}"
          RELEASE_TITLE: "AG File Manager v${{ steps.bump.outputs.version_name }}"
          APK_NAME: "${{ steps.bump.outputs.apk_name }}"
          VERSION_CODE: "${{ steps.bump.outputs.version_code }}"
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          echo "Publishing release ${TAG_NAME} at commit ${TARGET_SHA}..."

          if [ ! -f "$APK_NAME" ]; then
            echo "ERROR: Expected APK not found: $APK_NAME"
            exit 1
          fi

          attempt=1
          max_attempts=5
          sleep_secs=5

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Attempt ${attempt}/${max_attempts} for release ${TAG_NAME}..."

            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release ${TAG_NAME} already exists; uploading assets..."
              if gh release upload "$TAG_NAME" "$APK_NAME" version.json --clobber; then
                echo "Assets uploaded to existing release ${TAG_NAME}."
                exit 0
              fi
            else
              if gh release create "$TAG_NAME" "$APK_NAME" version.json \
                --target "$TARGET_SHA" \
                --title "$RELEASE_TITLE" \
                --generate-notes; then
                echo "Created release ${TAG_NAME} with generated release notes."
                exit 0
              fi

              echo "gh release create with --generate-notes failed; retrying without auto-generated notes..."
              if gh release create "$TAG_NAME" "$APK_NAME" version.json \
                --target "$TARGET_SHA" \
                --title "$RELEASE_TITLE" \
                --notes "Signed Android APK release ${TAG_NAME} (build ${VERSION_CODE})."; then
                echo "Created release ${TAG_NAME} with fallback release notes."
                exit 0
              fi
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Release step failed; waiting ${sleep_secs}s before retry..."
              sleep "$sleep_secs"
              sleep_secs=$((sleep_secs * 2))
            fi
            attempt=$((attempt + 1))
          done

          echo "ERROR: Failed to publish GitHub release ${TAG_NAME} after ${max_attempts} attempts."
          exit 1

      - name: Upload APK as Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bump.outputs.apk_name }}
          path: ${{ steps.bump.outputs.apk_name }}
