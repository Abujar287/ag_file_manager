name: Release Signed APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Monotonically increasing integer versionCode"
        required: true
      version_name:
        description: "Semantic versionName (e.g. 1.2.1)"
        required: true

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode persistent release keystore if configured
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
            echo "KEYSTORE_FILE=release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build signed minimal release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GRADLE_ARGS=""
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PVERSION_CODE=${{ github.event.inputs.version_code }}"
          fi
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            V_NAME="${{ github.event.inputs.version_name }}"
            V_NAME="${V_NAME#v}"
            GRADLE_ARGS="$GRADLE_ARGS -PVERSION_NAME=$V_NAME"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V_NAME="${GITHUB_REF_NAME#v}"
            GRADLE_ARGS="$GRADLE_ARGS -PVERSION_NAME=$V_NAME"
          fi
          gradle assembleRelease $GRADLE_ARGS
          V_NAME=$(grep -oE 'versionName = .*' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1)
          V_CODE=$(grep -oE 'versionCode = .*' app/build.gradle.kts | grep -oE '[0-9]+' | tail -n 1)
          cp app/build/outputs/apk/release/app-release.apk "AG_File_Manager_v${V_NAME}.apk"
          APKSIGNER_BIN=$(command -v apksigner || find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | head -n 1 || true)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --verbose --print-certs "AG_File_Manager_v${V_NAME}.apk"
          fi
          cat <<EOF > version.json
          {
            "versionCode": $V_CODE,
            "versionName": "$V_NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v${V_NAME}/AG_File_Manager_v${V_NAME}.apk"
          }
          EOF

      - name: Upload signed APK & version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V_NAME=$(node -e "console.log(require('./version.json').versionName)")
          V_CODE=$(node -e "console.log(require('./version.json').versionCode)")
          TAG_NAME="v${V_NAME}"
          APK_NAME="AG_File_Manager_v${V_NAME}.apk"
          TARGET_SHA="$(git rev-parse HEAD)"

          attempt=1
          max_attempts=5
          sleep_secs=5

          while [ "$attempt" -le "$max_attempts" ]; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              if gh release upload "$TAG_NAME" "$APK_NAME" version.json --clobber; then
                exit 0
              fi
            else
              if gh release create "$TAG_NAME" "$APK_NAME" version.json \
                --target "$TARGET_SHA" \
                --title "AG File Manager ${TAG_NAME}" \
                --generate-notes || \
                gh release create "$TAG_NAME" "$APK_NAME" version.json \
                --target "$TARGET_SHA" \
                --title "AG File Manager ${TAG_NAME}" \
                --notes "Signed Android APK release ${TAG_NAME} (build ${V_CODE})."; then
                exit 0
              fi
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$sleep_secs"
              sleep_secs=$((sleep_secs * 2))
            fi
            attempt=$((attempt + 1))
          done

          echo "ERROR: Failed to publish GitHub release ${TAG_NAME}"
          exit 1

