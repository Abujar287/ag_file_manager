name: Release Signed APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Monotonically increasing integer versionCode"
        required: true
      version_name:
        description: "Semantic versionName (e.g. 1.2.0)"
        required: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode persistent release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

      - name: Build signed minimal release APK
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          V_CODE="${{ github.event.inputs.version_code || github.run_number }}"
          V_NAME="${{ github.event.inputs.version_name || github.ref_name }}"
          V_NAME="${V_NAME#v}"
          ./gradlew assembleRelease \
            -PVERSION_CODE="$V_CODE" \
            -PVERSION_NAME="$V_NAME"
          cp app/build/outputs/apk/release/app-release.apk "AG_File_Manager_v${V_NAME}.apk"
          cat <<EOF > version.json
          {
            "versionCode": $V_CODE,
            "versionName": "$V_NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v${V_NAME}/AG_File_Manager_v${V_NAME}.apk"
          }
          EOF

      - name: Upload signed APK & version.json
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AG_File_Manager_v*.apk
            version.json
